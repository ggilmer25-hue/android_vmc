name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      - name: Accept Android licenses
        shell: pwsh
        run: |
          $input = ('y' + [char]13 + [char]10) * 20
          $input | flutter doctor --android-licenses || true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Verify Flet
        run: flet --version

      - name: Build APK (Flet)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          TERM: dumb
          NO_COLOR: '1'
          FLET_NO_RICH_OUTPUT: '1'
        run: flet build apk -v --yes --no-rich-output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/flutter/build/app/outputs/apk/release/app-release.apk
